[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-mcp-adapter"
version = "0.1.0"
description = "Optional read-only MCP source adapter"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "personal-ai-backend==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai_mcp_adapter"]
