name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-artifact-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - run: uv sync --locked --only-group build --no-install-project
        working-directory: backend
      - run: uv sync --locked --extra dev --group build --no-build-isolation
        working-directory: backend
      - run: make pi2-check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: personal_ai_test
          POSTGRES_USER: personal_ai
          POSTGRES_PASSWORD: personal_ai_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai -d personal_ai_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.13"
      - run: uv sync --locked --only-group build --no-install-project
      - run: uv sync --locked --extra dev --group build --no-build-isolation
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv build --no-build-isolation --python .venv/bin/python
      - run: cd ../reference-apps && uv build --no-build-isolation --python ../backend/.venv/bin/python
      - run: uv pip install --python .venv/bin/python --no-deps --no-index ../reference-apps/dist/personal_ai_reference_apps-0.1.0-py3-none-any.whl
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m pytest -m persistence_integration tests/persistence/test_provider_usage_accounting.py tests/persistence/test_artifact_tier.py tests/persistence/test_routing_decisions.py
        env:
          PERSISTENCE_TEST_POSTGRES_DSN: postgresql://personal_ai:personal_ai_test_only@127.0.0.1:5432/personal_ai_test
      - run: python -m personal_ai.evaluation.context
      - run: python -m personal_ai.evaluation.context_planner
      - run: python -m personal_ai.evaluation.planning
      - run: python -m personal_ai.evaluation.memory
      - run: python -m personal_ai.evaluation.memory_lifecycle
      - run: python -m personal_ai.evaluation.research
      - run: python -m personal_ai.evaluation.decision
      - run: python -m personal_ai.evaluation.iterative_research
      - run: python -m personal_ai_reference_apps.evaluation.domain
        env:
          APPLICATION_CONTRIBUTIONS: '["travel","shopping","finance","health"]'
      - run: python -m personal_ai_reference_apps.evaluation.itinerary_proposals
        env:
          APPLICATION_CONTRIBUTIONS: '["travel","shopping","finance","health"]'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag personal-ai-api:ci ./backend
      - run: docker build --tag personal-ai-web:ci ./frontend
