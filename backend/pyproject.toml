[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-backend"
version = "0.1.0"
description = "FastAPI backend for a personal AI system"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0,<5.0",
  "httpx>=0.27,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "google-auth>=2.0,<3.0",
  "google-cloud-pubsub>=2.21,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "boto3>=1.35,<2.0",
  "litellm==1.102.1",
  "pyjwt[crypto]>=2.10,<3",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.sdist]
include = ["/src/personal_ai", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_ai"]

# The repository ignores generated artifacts/ directories; these are source modules.
[tool.hatch.build.targets.sdist.force-include]
"src/personal_ai/artifacts" = "src/personal_ai/artifacts"

[tool.hatch.build.targets.wheel.force-include]
"src/personal_ai/artifacts" = "personal_ai/artifacts"

[dependency-groups]
build = ["hatchling==1.27.0", "editables==0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Source-tree compatibility harness for tests that exercise the optional bundle.
# It is not installed-artifact proof; CI runs pi1_artifact_checks.py separately.
pythonpath = ["src", "../reference-apps/src", "../examples/reading-logbook/client/src", "../examples/reading-logbook/host/src"]
markers = [
  "loopback_http: synthetic HTTP socket fixture; run with pi2_http_checks.py",
  "persistence_integration: requires local Postgres/pgvector and DynamoDB Local",
  "cloud_smoke: explicit opt-in against already-provisioned cloud resources",
]

# Shared wire module is formatted canonically at 88 columns by the suite generator.
[tool.ruff.format]
exclude = [
    "src/personal_ai/contracts/task_control.py","src/personal_ai/contracts/delegated_tasks.py"]
